version: 2
updates:
    - package-ecosystem: "composer"
      versioning-strategy: widen
      target-branch: "dev"
      directory: "/"
      schedule:
          interval: "daily"
      allow:
          - dependency-type: "direct"
      assignees:
          - "Aerendir"
      reviewers:
          - "Aerendir"
      commit-message:
          # Prefix all commit messages with "npm"
          prefix: "[PHP]"
      labels:
          - "Dependabot"
          - "[Type] Dependencies"
          - "[Lang] PHP"
          - "[Status] Automerge"
      open-pull-requests-limit: 1000
    - package-ecosystem: "github-actions"
      target-branch: "dev"
      directory: "/"
      schedule:
          interval: "daily"
      allow:
          - dependency-type: "direct"
      assignees:
          - "Aerendir"
      reviewers:
          - "Aerendir"
      commit-message:
          # Prefix all commit messages with "npm"
          prefix: "[GitHub Action]"
      labels:
          - "Dependabot"
          - "[Type] Dependencies"
          - "[Lang] GitHub Actions"
          - "[Status] Automerge"
      open-pull-requests-limit: 1000
    # PHP CS Fixer through Bamarni
    - package-ecosystem: "composer"
      versioning-strategy: increase
      target-branch: "dev"
      directory: "/vendor-bin/phpcs/"
      schedule:
          interval: "daily"
      allow:
          - dependency-type: "direct"
      assignees:
          - "Aerendir"
      reviewers:
          - "Aerendir"
      commit-message:
          # Prefix all commit messages with "npm"
          prefix: "[PHP]"
      labels:
          - "Dependabot"
          - "[Type] Dependencies"
          - "[Lang] PHP"
          - "[Status] Automerge"
      open-pull-requests-limit: 1000
    # PHPUnit through Bamarni
    - package-ecosystem: "composer"
      versioning-strategy: increase
      target-branch: "dev"
      directory: "/vendor-bin/phpunit/"
      ignore:
          # PHPUnit 13 requires PHP >= 8.4.1, and this matrix runs 8.3 on its lowest column: it
          # cannot be installed there. Widening the requirement into a union of lines is not the
          # answer either — a suite is written against one major only. Remove this entry when the
          # matrix floor reaches 8.4.1, in the same change that raises it.
          - dependency-name: "phpunit/phpunit"
            versions: [">=13"]
      schedule:
          interval: "daily"
      allow:
          - dependency-type: "direct"
      assignees:
          - "Aerendir"
      reviewers:
          - "Aerendir"
      commit-message:
          # Prefix all commit messages with "npm"
          prefix: "[PHP]"
      labels:
          - "Dependabot"
          - "[Type] Dependencies"
          - "[Lang] PHP"
          - "[Status] Automerge"
      open-pull-requests-limit: 1000
    # Phan through Bamarni
    - package-ecosystem: "composer"
      versioning-strategy: increase
      target-branch: "dev"
      directory: "/vendor-bin/phan/"
      schedule:
          interval: "daily"
      allow:
          - dependency-type: "direct"
      assignees:
          - "Aerendir"
      reviewers:
          - "Aerendir"
      commit-message:
          # Prefix all commit messages with "npm"
          prefix: "[PHP]"
      labels:
          - "Dependabot"
          - "[Type] Dependencies"
          - "[Lang] PHP"
          - "[Status] Automerge"
      open-pull-requests-limit: 1000
